{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Hospital</title>
    <link rel="stylesheet" href="{% static 'staticCSS/cadastro.css' %}">
</head>
<body>

    <header>
        <div class="container menu-container">
            <div class="logo-header">
                <a href="{% url 'home_publica' %}" class="logo-link">
                    <img class="logo-img" src="{% static 'imagens/Logo_CAYAC.png' %}" alt="Logo Cayac Saúde">
                    <h2>Cayac <span>Saúde</span></h2>
                </a>
            </div>
            <nav>
                <ul>
                    <li><a href="{% url 'pagina_login' %}">Entrar</a></li>
                    <li><a href="{% url 'home_publica' %}#servicos">Serviços</a></li>
                    <li><a href="{% url 'home_publica' %}#contato">Contato</a></li>
                </ul>
            </nav> 
        </div>
    </header>
    
    <div class="form-container">
        <div class="card"> 
            
        </div>
    </div>
    

    <main class="main-container">
        <div class="card-cadastro">
            
            <img src="{% static 'imagens/Logo_CAYAC.png' %}" alt="Logo Cayac Saúde" class="cadastro-logo-img">

            <h2>Criar Conta</h2>
            <p class="subtitle">Cuidando da sua saúde em todos os momentos</p>

            <form action="#" method="POST" class="form-cadastro" id="formCadastro" novalidate>
                {% csrf_token %}
                
                <div class="input-group">
                    <i class="fa-regular fa-user"></i>
                    <input type="text" id="nome" name="nome" placeholder="Nome completo" required>
                </div>

                <div class="input-group">
                    <i class="fa-regular fa-user"></i>
                    <input type="text" id="cpf" name="cpf" placeholder="CPF" maxlength="14" required>
                </div>

                <div class="input-group">
                    <i class="fa-regular fa-envelope"></i>
                    <input type="email" id="email" name="email" placeholder="E-mail" required>
                </div>
                <span id="erro-email" class="erro-email"></span>

                <div class="input-group">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="senha" name="senha" placeholder="Senha" required>
                </div>

                <button type="submit" class="btn-submit" id="btnCadastrar">Cadastrar</button>

                <div class="divider">
                    <span>ou</span>
                </div>

                <p class="login-link">
                    Já tem uma conta? <a href="{% url 'pagina_login' %}">Faça login</a>
                </p>

                
            </form>

        </div>
    </main>

    <script src="{% static 'staticJS/cadastro.js' %}"></script>

</body>
</html>
