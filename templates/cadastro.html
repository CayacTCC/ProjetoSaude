{% load static %}

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Hospital</title>
    <link rel="stylesheet" href="{% static 'staticCSS/cadastro.css' %}">
</head>
<body>

    <header class="navbar">
        <div class="logo">
            <i class="fa-solid fa-hospital-user"></i> Hospital <span>+</span>
        </div>
        <nav>
            <a href="#">Entrar</a>
            <a href="#">Serviços</a>
            <a href="#">Contato</a>
        </nav>
    </header>
    
    <div class="form-container"> <!-- só o form fica centralizado -->
        <div class="card"> 
            <!-- seu form do CAYAC aqui -->
        </div>
    </div>

    <main class="main-container">
        <div class="card-cadastro">
            
            <div class="card-icon">
                <i class="fa-solid fa-user"></i>
            </div>

            <h2>Criar Conta</h2>
            <p class="subtitle">Cuidando da sua saúde em todos os momentos</p>

            <form action="#" method="POST" class="form-cadastro">
                {% csrf_token %}
                
                <div class="input-group">
                    <i class="fa-regular fa-user"></i>
                    <input type="text" id="nome" name="nome" placeholder="Nome completo" required>
                </div>

                <div class="input-group">
                    <i class="fa-regular fa-user"></i>
                    <input type="text" id="cpf" name="cpf" placeholder="CPF" required>
                </div>

                <div class="input-group">
                    <i class="fa-regular fa-envelope"></i>
                    <input type="email" id="email" name="email" placeholder="E-mail" required>
                </div>

                <div class="input-group">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="senha" name="senha" placeholder="Senha" required>
                </div>

                <button type="submit" class="btn-submit">Cadastrar</button>

                <div class="divider">
                    <span>ou</span>
                </div>

                <p class="login-link">
                    Já tem uma conta? <a href= "{% url 'pagina_login' %}" >Faça login</a>
                </p>


            </form>

        </div>
    </main>

</body>
</html>
