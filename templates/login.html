{% load static %}

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de Login</title>    
    <link rel="stylesheet" href="{% static 'staticCSS/login.css' %}">
</head>
<body>

    <header>
        <div class="container menu-container">
            <div class="logo-header">
                <a href="{% url 'home_publica' %}" class="logo-link">
                    <img class="logo-img" src="{% static 'imagens/Logo_CAYAC.png' %}" alt="Logo Cayac Saúde">
                    <h2>Cayac <span>Saúde</span></h2>
                </a>
            </div>
            <nav>
                <ul>
                    <li><a href="{% url 'home_publica' %}">Início</a></li>
                    <li><a href="{% url 'home_publica' %}#servicos">Serviços</a></li>
                    <li><a href="{% url 'home_publica' %}#contato">Contato</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Container responsável por centralizar o formulário na tela abaixo do navbar -->
    <div class="form-container">
        <div class="login-container">
            <img src="{% static 'imagens/Logo_CAYAC.png' %}" alt="Logo Cayac Saúde" class="login-logo-img">
            <h1 class="main-heading">CAYAC</h1>
            <p class="sub-heading">Venha nos conhecer</p>

            <!-- Formulário de LOGIN -->
            <form method="POST">
                {% csrf_token %}

                {% if erro %}
                    <p style="color: red; text-align: center; font-size: 14px; margin-bottom: 10px;">{{ erro }}</p>
                {% endif %}

                <!--O campo de login-->
                <input type="email" name="email" class="input-field" placeholder="Email" required>
                <input type="password" name="senha" class="input-field" placeholder="Senha" required>

                <!-- O botão de LOGIN -->
                <button type="submit" class="login-button">Entrar</button>

            </form>


            <!-- Divisor com "Or" -->
            <div class="divider">
                <span class="divider-text">Or</span>
            </div>

            <!-- Botões de Login Social -->
            <div class="social-buttons">
            </div>

            <!-- Texto de Registro -->
            <p class="Cadastre-se-text">
                Não tem conta? <a href="{% url 'pagina_cadastro'%}" class="Cadastre-se-link" >Cadastre-se</a>
            </p>
        </div>
    </div>

</body>
</html>
