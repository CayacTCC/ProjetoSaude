{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agendar Consulta | Cayac Saúde</title>
  <!-- Ajuste o caminho dentro de static conforme sua pasta (ex: 'css/agendamento.css') -->
  <link rel="stylesheet" href="{% static 'agendamento.css' %}">
</head>
<body>

<header class="topo">
  <a class="marca" href="{% url 'area_paciente' %}" aria-label="Cayac Saúde - início">
    <svg class="marca-img" viewBox="0 0 64 64" aria-hidden="true">
      <circle cx="32" cy="32" r="30" fill="#eef6f6" stroke="#0f6b73" stroke-width="2"/>
      <path d="M26 14h12v12h12v12H38v12H26V38H14V26h12z" fill="none" stroke="#17a59a" stroke-width="3" stroke-linejoin="round"/>
      <text x="32" y="58" font-size="9" font-weight="700" text-anchor="middle" fill="#0f6b73" font-family="Arial">Cayac</text>
    </svg>
    <span class="marca-nome">Cayac <em>Saúde</em></span>
  </a>
  <a class="sair" href="{% url 'logout' %}">
    <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h4"/>
      <path d="M11 12h10M17 7l5 5-5 5"/>
    </svg>
    Sair
  </a>
</header>

<nav class="menu" aria-label="Área do paciente">
  <a href="{% url 'area_paciente' %}">
    <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M12 3 2 12h3v8h5v-5h4v5h5v-8h3z"/></svg>
    Início
  </a>
  <a href="{% url 'area_paciente' %}#paciente">Área do Paciente</a>
  <a href="{% url 'agendamento' %}" aria-current="page">Agendamento</a>
</nav>

<main>
  <form class="cartao" id="form" method="POST" novalidate>
    {% csrf_token %}
    <h2>Agendar Consulta</h2>
    <p class="sub">Escolha o hospital, a data e o horário que combinam com você</p>

    <fieldset>
      <legend>Onde e quando</legend>
      <div class="grade">
        <div>
          <label for="cidade">Cidade</label>
          <select id="cidade" name="cidade" required>
            <option value="">Selecione a cidade</option>
            <option value="Bertioga">Bertioga</option>
            <option value="Cubatão">Cubatão</option>
            <option value="Guarujá">Guarujá</option>
            <option value="Itanhaém">Itanhaém</option>
            <option value="Mongaguá">Mongaguá</option>
            <option value="Peruíbe">Peruíbe</option>
            <option value="Praia Grande">Praia Grande</option>
            <option value="Santos">Santos</option>
            <option value="São Vicente">São Vicente</option>
          </select>
          <div class="erro-msg" data-for="cidade"></div>
        </div>

        <div>
          <label for="hospital">Hospital</label>
          <select id="hospital" name="hospital" required disabled>
            <option value="">Escolha a cidade primeiro</option>
          </select>
          <div class="erro-msg" data-for="hospital"></div>
        </div>

        <div>
          <label for="especialidade">Especialidade</label>
          <select id="especialidade" name="especialidade" required>
            <option value="">Selecione a especialidade</option>
            <option value="Clínica geral">Clínica geral</option>
            <option value="Cardiologia">Cardiologia</option>
            <option value="Dermatologia">Dermatologia</option>
            <option value="Ginecologia">Ginecologia</option>
            <option value="Neurologia">Neurologia</option>
            <option value="Ortopedia">Ortopedia</option>
            <option value="Pediatria">Pediatria</option>
            <option value="Oftalmologia">Oftalmologia</option>
          </select>
          <div class="erro-msg" data-for="especialidade"></div>
        </div>

        <div>
          <label for="data">Data</label>
          <input type="date" id="data" name="data" required>
          <div class="erro-msg" data-for="data"></div>
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Horário disponível</legend>
      <div id="horas" class="horas" role="group" aria-label="Horários">
        <p class="aviso-horario">Selecione uma data para ver os horários.</p>
      </div>
      <input type="hidden" id="horario-selecionado" name="horario" required>
      <div class="erro-msg" data-for="horario"></div>
    </fieldset>

    <div class="acoes">
      <button type="submit" class="btn-confirmar">Confirmar Agendamento</button>
    </div>
  </form>
</main>

<script src="{% static 'agendamento.js' %}"></script>
</body>
</html>
